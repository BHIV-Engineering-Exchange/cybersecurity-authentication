global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'blockchain-nodes'
    static_configs:
      - targets:
          - 'node1:8080'
          - 'node2:8080'
          - 'node3:8080'
          - 'node4:8080'
          - 'node5:8080'
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  - job_name: 'bridge'
    static_configs:
      - targets: ['blackhole-bridge:8084']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'pdv-agents'
    static_configs:
      - targets:
          - 'pdv-exec:9101'
          - 'pdv-val:9102'
          - 'pdv-replay:9103'
    metrics_path: '/health'
    scrape_interval: 15s

  - job_name: 'fraud-service'
    static_configs:
      - targets: ['fraud-service:9090']
    metrics_path: '/health'
    scrape_interval: 15s
